[package]
name = "devprotector"
version = "0.1.0"
description = "Real-time protection against malicious code in dev projects"
authors = ["nevulasinc@gmail.com"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devprotector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-webdriver-automation = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-full = "0.3"
walkdir = "2"
regex = "1"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.31"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
